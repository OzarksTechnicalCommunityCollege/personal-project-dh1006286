{% extends "study/base.html" %}
{% load static %}
{% block title %}Game · {{ set.name }}{% endblock %}
{% block extra_css %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/game.css' %}">
{% endblock %}
{% block content %}

<div class="menu">
    <div id="questionContainer">
        <p id="questionText">Loading question...</p>
    </div>
    <div id="cardOptions">
        <div id="option1Container">
            <p id="option1Text"></p>
        </div>
        <div id="option2Container">
            <p id="option2Text"></p>
        </div>
        <div id="option3Container">
            <p id="option3Text"></p>
        </div>
        <div id="option4Container">
            <p id="option4Text"></p>
        </div>
    </div>
</div>

{{ cards|json_script:"cards" }}
<script src="{% static 'js/startGame.js' %}"></script>
{% endblock %}
