{% extends "study/base.html" %}
{% block title %}Edit Set{% endblock %}
{% block extra_css %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/forms.css' %}">
{% endblock %}
{% block content %}
<div class="outerForm">
    {% if sent %}
    <div class="success-banner">
        <h2>Edited Set Successfully</h2>
        <p style="color: var(--text-secondary); margin-top: 1rem; font-size: 0.9rem;">
            <a href="{% url 'study:make_set' %}" class="btn btn-gold" style="margin-right: 0.75rem;">+ New Set</a>
            <a href="{% url 'study:set_collection' %}" class="btn btn-outline">My Collection</a>
        </p>
    </div>
    {% else %}
    <h2>Create New Set</h2>
    <form action="{% url 'study:edit_set' %}" method="post">
        {{ form.as_p }}
        {% csrf_token %}
        <input type="submit" value="Edit Set">
    </form>
    {% endif %}
</div>
{% endblock %}
